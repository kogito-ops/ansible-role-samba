---
# Defines server role
# (standalone server, active directory domain controller, or member server)
samba_server_role: standalone server

# Defines if you are building an Active Directory domain controller
samba_create_domain_controller: false

# Defines if the server should join a domain as a member server
samba_join_domain: false

# Clean up stale runtime files before starting Samba AD DC service
# This helps prevent "Failed to cleanup temporary files" errors on restarts
samba_cleanup_runtime_files: true

# Legacy domain controller support
# Enable this for joining legacy domain controllers that don't support encrypted LDAP
# Common scenarios:
#   - Legacy Samba DCs running in containerized environments (Kubernetes/Docker)
#   - Older Windows Server versions with limited encryption support
#   - Network environments with SSL/TLS termination at load balancers
# WARNING: This reduces security by disabling LDAP encryption and strong authentication
# Only enable this when absolutely necessary for compatibility
samba_allow_unencrypted_ldap: false

# Domain member specific settings
samba_domain_member:
  domain: '{{ samba_primary_domain }}'
  workgroup: '{{ samba_workgroup }}'
  realm: '{{ samba_primary_domain | upper }}'
  domain_admin_user: Administrator
  domain_admin_password: ChangeMe123! # SECURITY: Use Ansible Vault in production
  domain_controller: '{{ samba_primary_domain_controller }}' # or DNS name
  id_mapping:
    backend: rid # Options: rid, autorid, ad, tdb
    range_min: 10000
    range_max: 999999

# Defines if groups defined in samba_domain_groups list should be created
samba_create_domain_groups: false

# Defines if organizational units defined in samba_domain_organizational_units list should be created
samba_create_domain_organizational_units: false

# Enable to hide organizational units output
samba_domain_organizational_units_no_log: true

# Define organizational units to create
samba_domain_organizational_units:
  []
  # - 'OU=Domain Computers,DC=ad,DC=example,DC=com'
  # - 'OU=Desktops,OU=Domain Computers,DC=ad,DC=example,DC=com'

# Defines if Group Policy Objects defined in samba_domain_group_policies list should be created
samba_create_domain_group_policies: false

# Enable to hide Group Policy Objects output
samba_domain_group_policies_no_log: true

# Define Group Policy Objects to create and deploy
samba_domain_group_policies:
  []
  # Example GPO configuration:
  # - name: 'Network Drive Mappings'
  #   link_to:
  #     - 'DC=ad,DC=example,DC=com'  # Link to domain root
  #     - 'OU=Workstations,DC=ad,DC=example,DC=com'  # Link to specific OU
  #   link_option: 'enforced'  # Options: enforced, enabled, disabled
  #   policy_files:
  #     # Create directory structure
  #     - type: directory
  #       path: 'User/Preferences/Drives'
  #     # Deploy from file source
  #     - type: file
  #       src: 'files/gpo/drives.xml'
  #       dest: 'User/Preferences/Drives/Drives.xml'
  #       mode: '0644'
  #     # Deploy from Jinja2 template
  #     - type: template
  #       template: 'gpo/drives.xml.j2'
  #       dest: 'User/Preferences/Drives/Drives.xml'
  #       mode: '0644'
  #     # Deploy inline content
  #     - type: content
  #       content: '<?xml version="1.0" encoding="utf-8"?><Drives></Drives>'
  #       dest: 'User/Preferences/Drives/Drives.xml'
  #       mode: '0644'

# Defines if users defined in samba_domain_users list should be created
samba_create_domain_users: false

# Define Ansible group which contains your Samba domain controllers
samba_domain_controllers_group: samba_domain_controllers

# Define which Ansible host should be considered the primary domain controller
samba_primary_domain_controller: '{{ groups[samba_domain_controllers_group][0] }}'

# Defines the domain controller default IP address
samba_domain_controller_ip: '{{ ansible_default_ipv4.address }}'

# Defines if Samba TDB is replaced with clustered TDB
samba_create_cluster: false

samba_primary_domain: samba.internal
samba_netbios_domain_name: "{{ samba_primary_domain.split('.') }}"

# Defines Samba AD configuration
# WARNING: The default passwords below are for demonstration only!
# For production use, please use Ansible Vault to encrypt sensitive data:
# ansible-vault encrypt_string 'your-secure-password' --name 'samba_ad_info.adminpass'
samba_ad_info:
  ad_dc_hostname: '{{ ansible_hostname }}'
  ad_dc_fqdn: '{{ ansible_fqdn }}'
  ad_dns_domain_name: '{{ samba_primary_domain }}'
  adminpass: ChangeMe123! # SECURITY: Use Ansible Vault in production
  machinepass: ChangeMeToo456! # SECURITY: Use Ansible Vault in production
  allow_dns_updates: disabled
  backend_dns: SAMBA_INTERNAL
  dns_forwarder: 8.8.8.8
  kerberos_realm: '{{ samba_primary_domain }}'
  netbios_domain_name: '{{ samba_netbios_domain_name[0] | upper }}'

# Per-DC DNS forwarder configuration
# This can be set per-host in inventory or host_vars to use different DNS forwarders
# on different domain controllers. Falls back to samba_ad_info.dns_forwarder if not set.
# Supports multiple forwarders separated by spaces: '1.1.1.1 8.8.8.8'
samba_dns_forwarder: '{{ samba_ad_info.dns_forwarder }}'

# Defines workgroup for standalone server
samba_workgroup: '{{ samba_netbios_domain_name[0] | upper }}'

# Define additional startup options for the Samba service(s)
samba_extra_options: ''

# Define groups to create
samba_local_groups:
  []
  # - test-group
  # - secure-group
  # - insecure-group

# Define users to create with group memberships
samba_local_users:
  []
  # - name: test-user
  #   # Define samba user password
  #   smbpasswd: P@55w0rd
  #   # Define groups to add user to
  #   # ensure samba_groups names exist.
  #   groups:
  #       - test-group
  #       - insecure-group

# Enable to hide groups output
samba_local_groups_no_log: true

# Enable to hide users output
samba_local_users_no_log: true

# Define the path where Samba will manage shared/exported directories
samba_shares_path: /mnt/samba/shares

# Define the path where Samba will manage user profiles
samba_profiles_path: /mnt/samba/profiles

samba_shares:
  []
  # - name: allaccess
  #   owner: nobody
  #   group: nogroup
  #   mode: '0755'
  #   browsable: 'yes'
  #   guest_ok: 'yes'
  #   read_only: 'no'
  #   writable: 'yes'
  # - name: public
  #   owner: nobody
  #   group: nogroup
  #   mode: '0777'
  #   browsable: 'yes'
  #   guest_ok: 'yes'
  #   read_only: 'no'
  #   writable: 'yes'
  # - name: secured
  #   group: secure-group
  #   mode: '0770'
  #   browsable: 'yes'
  #   guest_ok: 'no'
  #   valid_users: '@secure-group'
  #   writable: 'yes'

# Enable to hide users output
samba_domain_users_no_log: true

# Domain users configuration
# When samba_enable_rfc2307 is true, users automatically receive Unix attributes:
#   - uidNumber: Auto-assigned from samba_rfc2307_domain_user_uid_start (default: 10100+)
#   - gidNumber: Primary group GID (default: 10000 for Domain Users)
#   - unixHomeDirectory: Unix home directory path (default: /home/<username>)
#   - loginShell: User's shell (default: /bin/bash)
#   - msSFU30NisDomain: NIS domain name for compatibility
#   - msSFU30Name: Unix username
samba_domain_users:
  []
  # Basic user example (minimal configuration):
  # - name: jdoe
  #   password: 'SecureP@ssw0rd123!'  # SECURITY: Use Ansible Vault in production
  #
  # Full user example with all attributes:
  # - name: jsmith
  #   password: 'AnotherSecureP@ss456!'  # SECURITY: Use Ansible Vault in production
  #   given_name: 'Jane'                 # First name
  #   surname: 'Smith'                   # Last name
  #   mail_address: 'jsmith@example.com' # Email address
  #   description: 'Jane Smith - Engineering Lead'  # User description
  #   use_username_as_cn: true           # Use username as CN (recommended)
  #   account_disabled: false            # Enable account (default: false)
  #   # Optional RFC2307 Unix attribute overrides (auto-assigned if omitted):
  #   # uid: 10150                       # Specific UID (default: auto-increment from 10100)
  #   # gid: 10500                       # Primary GID (default: 10000 = Domain Users)
  #   # unix_home: '/home/jsmith'        # Home directory (default: /home/<username>)
  #   # login_shell: '/bin/bash'         # Shell (default: /bin/bash)

# Enable to hide groups output
samba_domain_groups_no_log: true

# Domain groups configuration
# When samba_enable_rfc2307 is true, groups automatically receive Unix attributes:
#   - gidNumber: Auto-assigned from samba_rfc2307_domain_group_gid_start (default: 10500+)
#   - msSFU30NisDomain: NIS domain name for compatibility
#   - msSFU30Name: Unix group name
samba_domain_groups:
  []
  # Basic group example (auto-assigned GID):
  # - name: Engineering
  #   description: 'Engineering Team'
  #   members:
  #     - jdoe
  #     - jsmith
  #   # RFC2307: gidNumber will be auto-assigned (10500, 10501, 10502, ...)
  #
  # Group with specific GID (for legacy compatibility):
  # - name: Executives
  #   description: 'Executive Board (Vorstand)'
  #   members:
  #     - ceo
  #     - cfo
  #   gid: 502  # Specific GID for compatibility with legacy systems
  #
  # Group without members (members added later):
  # - name: 'Service Accounts'
  #   description: 'Group for all service accounts'
  #   members: []

# Defines if service accounts defined in samba_domain_service_accounts list should be created
samba_create_domain_service_accounts: false

# Enable to hide service accounts output (passwords, etc)
samba_domain_service_accounts_no_log: true

# Service accounts configuration
# Service accounts are special user accounts for applications/services
# When samba_enable_rfc2307 is true, service accounts automatically receive Unix attributes:
#   - uidNumber: Auto-assigned from samba_rfc2307_service_account_uid_start (default: 11000+)
#   - gidNumber: Primary group GID (default: 10000 for Domain Users or service account group)
#   - unixHomeDirectory: Unix home directory path (default: /home/<username>)
#   - loginShell: Shell for service account (default: /bin/false for security)
#   - msSFU30NisDomain: NIS domain name for compatibility
#   - msSFU30Name: Unix username
samba_domain_service_accounts:
  []
  # Basic service account example (minimal configuration):
  # - name: svc_postgres
  #   password: 'SecureP@ssw0rd123!'        # SECURITY: Use Ansible Vault in production
  #   description: 'PostgreSQL Service Account'
  #   # RFC2307: uidNumber auto-assigned (11000, 11001, 11002, ...)
  #   # RFC2307: loginShell defaults to /bin/false
  #
  # Service account with Kerberos keytab export:
  # - name: svc_webapp
  #   password: 'AnotherSecureP@ss456!'     # SECURITY: Use Ansible Vault in production
  #   description: 'Web Application Service Account'
  #   password_never_expires: true          # Service accounts should not expire (default: true)
  #   account_disabled: false               # Enable account (default: false)
  #   add_to_group: true                    # Add to service accounts group (default: true)
  #   group: 'Service Accounts'             # Group name (default: 'Service Accounts')
  #   spn: 'HTTP/webapp.example.com'       # Service Principal Name for Kerberos auth
  #   export_keytab: true                   # Export Kerberos keytab file
  #   keytab_path: '/etc/krb5.keytab.webapp'  # Path for keytab export
  #   keytab_owner: 'www-data'              # Keytab file owner
  #   keytab_group: 'www-data'              # Keytab file group
  #   keytab_mode: '0600'                   # Keytab file permissions (read-only for owner)
  #
  # Service account with password update:
  # - name: svc_ldap_reader
  #   password: 'NewPassword789!'           # SECURITY: Use Ansible Vault in production
  #   description: 'LDAP Reader Service Account'
  #   update_password: true                 # Update password if account already exists

samba_security: user

# Defines if transport encryption should be enabled
samba_tls_enable: false

# Defines the private key used for transport encryption
samba_tls_key: /etc/ssl/private/samba.key

# Defines the public key used for transport encryption
samba_tls_certificate: /etc/ssl/certs/samba.crt

# Defines the file containing known CA certificates
samba_tls_ca_certificate: /etc/ssl/certs/ca-certificates.crt

# PAM and home directory settings
# Enable PAM mkhomedir module for automatic home directory creation
samba_pam_mkhomedir_enabled: true
samba_home_path: /home
samba_home_umask: '0022'
# Enable Samba share for home directories
# When enabled, a 'homes' share will be automatically configured
samba_home_share_enabled: true

# SSH access control for users
samba_ssh_allow_users:
  []
  # - "admin@{{ samba_primary_domain }}"

# Password Policy Settings
samba_password_policy:
  complexity_enabled: true
  history_length: 24
  max_age: 43 # days
  min_age: 1 # days
  min_length: 7

# Account Lockout Policy
samba_account_policy:
  lockout_duration: 30 # minutes
  lockout_threshold: 0 # 0 = disabled
  reset_lockout_after: 30 # minutes

# Enhanced Domain Provisioning Options
# Enable enhanced security settings during domain provisioning
samba_enhanced_provisioning_enabled: true
samba_rpc_port_range: '49152-65535' # Dynamic RPC port range
samba_security_options:
  require_strong_auth: true
  password_hash_schemes:
    - CryptSHA256
    - CryptSHA512

# AD Recycle Bin
samba_enable_recycle_bin: true

# System directories (used in templates)
# Data directory for Samba databases
samba_datadir: /var/lib/samba
# Log directory for Samba logs
samba_logdir: /var/log/samba
# Spool directory for print jobs
samba_spooldir: /var/spool/samba
# State directory for Samba state files
samba_statedir: /var/lib/samba
# systemd-resolved configuration directory
samba_systemd_resolveddir: /etc/systemd/resolved.conf.d
# Kerberos configuration file path
samba_krb5_conf: /etc/krb5.conf
# System log directory
samba_system_logdir: /var/log

# System paths
# Path to useradd command
samba_useradd_command: /usr/sbin/useradd
# Path to groupadd command
samba_groupadd_command: /usr/sbin/groupadd
# Path to usermod command
samba_usermod_command: /usr/sbin/usermod
# Path to passwd command
samba_passwd_command: /usr/bin/passwd
# Path to pdbedit command
samba_pdbedit_command: /usr/bin/pdbedit
# Shell for system accounts
samba_system_shell: /bin/false
# Home directory for system accounts
samba_system_homedir: /dev/null

# Network settings
# LDAP port for domain controller connectivity
samba_ldap_port: 389
# Timeout for waiting for domain controller (in seconds)
samba_wait_timeout: 120

# Recycle bin settings
# dsheuristics value for enabling recycle bin
samba_dsheuristics_value: '0000002'
# Administrator account for recycle bin operations
samba_recycle_bin_admin: Administrator

# Kerberos configuration
# Ticket lifetime (in hours)
samba_krb5_ticket_lifetime: 24h
# Renewable ticket lifetime (in days)
samba_krb5_renew_lifetime: 7d

# RFC2307 Schema Configuration
# Enable RFC2307 schema extensions for Unix/Linux attribute support
# Required for Linux clients to get proper Unix attributes (UID, GID, shell, home)
samba_enable_rfc2307: true
# Starting UID/GID for RFC2307 ID mapping
samba_rfc2307_id_start: 10000
# Starting UID for domain users
# This reserves UIDs 10100-10999 for regular domain users
samba_rfc2307_domain_user_uid_start: 10100
# Starting GID for domain groups
# This reserves GIDs 10500-10999 for custom domain groups
samba_rfc2307_domain_group_gid_start: 10500
# Starting UID for service accounts
# This reserves UIDs 11000+ for service accounts
samba_rfc2307_service_account_uid_start: 11000
# Create Unix Admin group (avoids Domain Admins GID mapping issues)
samba_rfc2307_create_unix_admins: true
# Unix Admins group name
samba_rfc2307_unix_admins_group: 'Unix Admins'

# SSH Key Schema Configuration
# Enable SSH public key schema extensions for centralized SSH key management
# Allows storing SSH public keys in AD user objects for centralized key distribution
samba_enable_ssh_schema: true
# Allow SSH key storage in AD user objects
samba_ssh_schema_allow_public_keys: true

# Sudo Schema Configuration
# Enable Sudo schema extensions for centralized sudo rule management
# Allows storing sudo rules in AD for centralized sudo configuration
samba_enable_sudo_schema: true
# Create default sudo rules container
samba_sudo_create_default_container: true
# Default sudo container OU name
samba_sudo_container_name: 'sudoers'

# Supported encryption types
samba_krb5_enctypes:
  - aes256-cts-hmac-sha1-96
  - aes128-cts-hmac-sha1-96

# CTDB clustering configuration
# Log destination (syslog or file path)
samba_ctdb_log_destination: syslog
# Log level (EMERG, ALERT, CRIT, ERR, WARNING, NOTICE, INFO, DEBUG)
samba_ctdb_log_level: NOTICE

# Samba configuration
# Server description string
samba_server_string: '(Samba, Ubuntu)'
# Maximum log file size in KB
samba_max_log_size: 1000
# Password chat string for passwd program
samba_passwd_chat: "*Enter\\snew\\s*\\spassword:* %n\\n *Retype\\snew\\s*\\spassword:* %n\\n *password\\supdated\\ssuccessfully* ." # yamllint disable-line rule:line-length
# File creation masks
samba_create_mask: '0600'
samba_directory_mask: '0700'
samba_force_create_mode: '0775'
samba_force_directory_mode: '0775'
# Home directory permissions
samba_home_create_mask: '0700'
samba_home_directory_mask: '0700'
# Profile directory permissions
samba_profiles_create_mask: '0700'
samba_profiles_directory_mask: '0700'
# Printer spool permissions
samba_printers_create_mask: '0700'
