      samba_groupadd_command:
        type: path
        required: false
        default: /usr/sbin/groupadd
        description: Path to groupadd command.

      samba_usermod_command:
        type: path
        required: false
        default: /usr/sbin/usermod
        description: Path to usermod command.

      samba_passwd_command:
        type: path
        required: false
        default: /usr/bin/passwd
