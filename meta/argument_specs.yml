      samba_statedir:
        type: path
        required: false
        default: /var/lib/samba
        description: State directory for Samba state files.

      samba_systemd_resolveddir:
        type: path
        required: false
        default: /etc/systemd/resolved.conf.d
        description: systemd-resolved configuration directory.

      samba_krb5_conf:
        type: path
        required: false
        default: /etc/krb5.conf
        description: Kerberos configuration file path.

      samba_system_logdir:
        type: path
        required: false
        default: /var/log
        description: System log directory.

      # =======================================================================
