---
- name: Converge
  hosts: all
  become: true

  vars:
      ansible_python_interpreter: auto_silent

  pre_tasks:
      - name: Update apt cache
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 600
        changed_when: false
        when: ansible_facts['os_family'] == 'Debian'

  roles:
      - role: kogito-ops.samba
