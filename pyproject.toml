[project]
name = "ansible-role-samba"
version = "0.1.0"
description = "Ansible role for Samba server management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kogito-ops" }
]
keywords = ["ansible", "samba", "active-directory", "domain-controller"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "ansible-core>=2.13.9,<=2.18",
    "netaddr",
    "jmespath",
    "lxml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "ansible-lint",
    "molecule",
    "molecule-plugins[podman]",
    "molecule-qemu",
    "pytest-testinfra",
    "yamllint",
]

test = [
    "molecule",
    "molecule-plugins[podman]",
    "molecule-qemu",
    "pytest-testinfra",
]

lint = [
    "ansible-lint",
    "yamllint",
]

[project.urls]
Homepage = "https://github.com/kogito-ops/ansible-role-samba"
Repository = "https://github.com/kogito-ops/ansible-role-samba.git"
Issues = "https://github.com/kogito-ops/ansible-role-samba/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.yamllint]
extends = "default"

[tool.yamllint.rules]
line-length = { max = 120, level = "warning" }
truthy = { allowed-values = ["true", "false", "yes", "no"] }

[tool.ansible-lint]
profile = "production"
exclude_paths = [
    ".git/",
    ".venv/",
    "venv/",
]
skip_list = [
    "yaml[line-length]",
]
