---
- name: Pre-Flight Checks | Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Ubuntu', 'Debian']
      - >-
        (ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04'])
        or (ansible_distribution == 'Debian' and ansible_distribution_major_version == '12')

    fail_msg: >-
      This role only supports Ubuntu 22.04 (Jammy), Ubuntu 24.04 (Noble), and Debian 12 (Bookworm).
      Current system: {{ ansible_distribution }} {{ ansible_distribution_version }}

    success_msg: 'Operating system {{ ansible_distribution }} {{ ansible_distribution_version }} is supported'
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Check supported architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      This role only supports amd64 (x86_64) and arm64 (aarch64) architectures.
      Current architecture: {{ ansible_architecture }}

    success_msg: 'Architecture {{ ansible_architecture }} is supported'
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Fail on unsupported Samba server role
  ansible.builtin.fail:
    msg:
      - 'Unsupported value for samba_server_role, must be "standalone server",'
      - '"active directory domain controller", or "member server"'
      - '{{ samba_server_role }} is an unsupported server role'
  when: samba_server_role not in ['standalone server', 'active directory domain controller', 'member server']
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Fail on unsupported Samba security mode
  ansible.builtin.fail:
    msg:
      - 'Unsupported value for samba_security, must be "share"'
      - '"user", "domain", "server" or "ads"'
      - '{{ samba_security }} is an unsupported service manager'
  when: samba_security not in ['share', 'user', 'domain', 'server', 'ads']
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert server role is standalone server when DC creation is disabled
  ansible.builtin.assert:
    that:
      - samba_server_role == 'standalone server'
    fail_msg: "`samba_server_role` must be 'standalone server' when `samba_create_domain_controller` is disabled"
    success_msg: 'Samba standalone server creation is enabled'
  when:
    - not samba_create_domain_controller | bool
    - samba_server_role not in ['member server', 'active directory domain controller']
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert server role is domain controller when creating a DC
  ansible.builtin.assert:
    that:
      - samba_server_role == 'active directory domain controller'
    fail_msg: >-
      `samba_server_role` must be 'active directory domain controller' when `samba_create_domain_controller` is enabled

    success_msg: 'Samba AD Domain Controller creation is enabled'
  when:
    - samba_create_domain_controller | bool
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert DNS backend is valid when creating a DC
  ansible.builtin.assert:
    that:
      - samba_ad_info['backend_dns'] in ['SAMBA_INTERNAL', 'BIND9_DLZ']
    fail_msg: 'DNS backend can only be `SAMBA_INTERNAL` or `BIND9_DLZ`.'
    success_msg: 'Samba AD Domain Controller DNS backend is enabled'
  when:
    - samba_create_domain_controller | bool
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert required AD variables are defined when creating a DC
  ansible.builtin.assert:
    that:
      - samba_ad_info is defined
      - samba_ad_info.adminpass is defined
      - samba_ad_info.adminpass | length > 0
      - samba_ad_info.kerberos_realm is defined
      - samba_ad_info.netbios_domain_name is defined
      - samba_ad_info.backend_dns is defined
    fail_msg: >-
      When creating a domain controller, samba_ad_info must be defined with adminpass,
      kerberos_realm, netbios_domain_name, and backend_dns

    success_msg: 'Required AD configuration is properly defined'
  when:
    - samba_create_domain_controller | bool
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert domain controller group is defined when creating a DC
  ansible.builtin.assert:
    that:
      - samba_domain_controllers_group is defined
      - samba_domain_controllers_group | length > 0
      - groups[samba_domain_controllers_group] is defined
    fail_msg: 'samba_domain_controllers_group must be defined and contain at least one host'
    success_msg: 'Domain controllers group is properly defined'
  when:
    - samba_create_domain_controller | bool
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert TLS certificate paths when TLS is enabled
  ansible.builtin.assert:
    that:
      - samba_tls_key is defined
      - samba_tls_certificate is defined
      - samba_tls_ca_certificate is defined
    fail_msg: >-
      When samba_tls_enable is true, you must define samba_tls_key, samba_tls_certificate, and samba_tls_ca_certificate

    success_msg: 'TLS configuration is properly defined'
  when:
    - samba_tls_enable is defined
    - samba_tls_enable | bool
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert domain join is configured for member servers
  ansible.builtin.assert:
    that:
      - samba_join_domain is defined
    fail_msg: "samba_join_domain must be defined when samba_server_role is 'member server'"
    success_msg: 'Domain member server configuration is valid'
  when:
    - samba_server_role == 'member server'
  tags:
    - samba
    - samba-assertions

- name: Pre-Flight Checks | Assert member server configuration is defined
  ansible.builtin.assert:
    that:
      - samba_domain_member is defined
      - samba_domain_member.domain is defined
      - samba_domain_member.domain_admin_user is defined
      - samba_domain_member.domain_admin_password is defined
    fail_msg: 'samba_domain_member configuration must be defined for member servers'
    success_msg: 'Member server configuration is properly defined'
  when:
    - samba_server_role == 'member server'
  tags:
    - samba
    - samba-assertions
