---
# Retrieve current password policy settings
- name: Password Policy | Get current password settings
  become: true
  ansible.builtin.command:
    cmd: samba-tool domain passwordsettings show
  register: current_password_settings
  changed_when: false
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
  tags:
    - samba
    - samba-ad
    - samba-policies

# Parse current settings - using single-line expressions to avoid YAML folding issues
- name: Password Policy | Parse current settings
  ansible.builtin.set_fact:
    _current_password_policy:
      # yamllint disable rule:line-length
      complexity: "{{ ((current_password_settings.stdout | regex_findall('Password complexity: (on|off)') | list + ['off']) | first) | trim }}"
      history_length: "{{ ((current_password_settings.stdout | regex_findall('Password history length: (\\d+)') | list + ['0']) | first) | trim | int }}"
      min_length: "{{ ((current_password_settings.stdout | regex_findall('Minimum password length: (\\d+)') | list + ['0']) | first) | trim | int }}"
      min_age: "{{ ((current_password_settings.stdout | regex_findall('Minimum password age \\(days\\): (\\d+)') | list + ['0']) | first) | trim | int }}"
      max_age: "{{ ((current_password_settings.stdout | regex_findall('Maximum password age \\(days\\): (\\d+)') | list + ['0']) | first) | trim | int }}"
      lockout_duration: "{{ ((current_password_settings.stdout | regex_findall('Account lockout duration \\(mins\\): (\\d+)') | list + ['0']) | first) | trim | int }}"
      lockout_threshold: "{{ ((current_password_settings.stdout | regex_findall('Account lockout threshold \\(attempts\\): (\\d+)') | list + ['0']) | first) | trim | int }}"
      reset_lockout_after: "{{ ((current_password_settings.stdout | regex_findall('Reset account lockout after \\(mins\\): (\\d+)') | list + ['0']) | first) | trim | int }}"
      # yamllint enable rule:line-length
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - current_password_settings is defined
    - current_password_settings is not skipped
    - current_password_settings.stdout is defined
    - current_password_settings.stdout | length > 0
  tags:
    - samba
    - samba-ad
    - samba-policies

# Determine if password policy needs updating
- name: Password Policy | Check if password policy needs updating
  ansible.builtin.set_fact:
    _password_policy_needs_update: >-
      {{
        (_current_password_policy.complexity | trim !=
         (samba_password_policy.complexity_enabled | bool | ternary('on', 'off'))) or
        (_current_password_policy.history_length | int !=
         samba_password_policy.history_length | int) or
        (_current_password_policy.min_length | int !=
         samba_password_policy.min_length | int) or
        (_current_password_policy.min_age | int !=
         samba_password_policy.min_age | int) or
        (_current_password_policy.max_age | int !=
         samba_password_policy.max_age | int)
      }}
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - _current_password_policy is defined
  tags:
    - samba
    - samba-ad
    - samba-policies

# Apply password policy only if different
- name: Password Policy | Apply password policy settings
  become: true
  ansible.builtin.command:
    # yamllint disable rule:line-length
    cmd: >
      samba-tool domain passwordsettings set --complexity={{ samba_password_policy.complexity_enabled | bool | ternary('on', 'off') }} --history-length={{ samba_password_policy.history_length }} --max-pwd-age={{ samba_password_policy.max_age }} --min-pwd-age={{ samba_password_policy.min_age }} --min-pwd-length={{ samba_password_policy.min_length }}

    # yamllint enable rule:line-length
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  changed_when: _password_policy_needs_update | default(false)
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - _password_policy_needs_update | default(false)
  tags:
    - samba
    - samba-ad
    - samba-policies

# Determine if account lockout policy needs updating
- name: Account Policy | Check if account lockout policy needs updating
  ansible.builtin.set_fact:
    _account_policy_needs_update: >-
      {{
        (samba_account_policy.lockout_threshold | int > 0) and (
          (_current_password_policy.lockout_duration | int !=
           samba_account_policy.lockout_duration | int) or
          (_current_password_policy.lockout_threshold | int !=
           samba_account_policy.lockout_threshold | int) or
          (_current_password_policy.reset_lockout_after | int !=
           samba_account_policy.reset_lockout_after | int)
        )
      }}
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - _current_password_policy is defined
  tags:
    - samba
    - samba-ad
    - samba-policies

# Apply account lockout policy only if different
- name: Account Policy | Apply account lockout policy
  become: true
  ansible.builtin.command:
    # yamllint disable rule:line-length
    cmd: >
      samba-tool domain passwordsettings set --account-lockout-duration={{ samba_account_policy.lockout_duration }} --account-lockout-threshold={{ samba_account_policy.lockout_threshold }} --reset-account-lockout-after={{ samba_account_policy.reset_lockout_after }}

    # yamllint enable rule:line-length
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  changed_when: _account_policy_needs_update | default(false)
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - _account_policy_needs_update | default(false)
  tags:
    - samba
    - samba-ad
    - samba-policies

# Display current settings for verification
- name: Password Policy | Display applied settings
  become: true
  ansible.builtin.command:
    cmd: samba-tool domain passwordsettings show
  register: final_password_settings
  changed_when: false
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - samba_server_role == "active directory domain controller"
    - _samba_domain_exists | default(false)
    - (_password_policy_needs_update | default(false)) or (_account_policy_needs_update | default(false))
  tags:
    - samba
    - samba-ad
    - samba-policies

- name: Password Policy | Show final settings
  ansible.builtin.debug:
    msg: '{{ final_password_settings.stdout_lines }}'
  delegate_to: '{{ samba_primary_domain_controller }}'
  run_once: true
  when:
    - final_password_settings is defined
    - final_password_settings.stdout_lines is defined
  tags:
    - samba
    - samba-ad
    - samba-policies
