---
# Tasks for managing Samba AD service accounts
# Service accounts are user accounts with specific properties for applications/services
# Note: Groups must be created first via domain_groups.yml

- name: Service accounts | Generate list of existing domain users
  become: true
  ansible.builtin.command:
    cmd: samba-tool user list
  changed_when: false
  register: existing_domain_users
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Ensure service accounts exist
  become: true
  ansible.builtin.command:
    cmd: >
      samba-tool user create {{ item['name'] }} '{{ item['password'] }}'
      --use-username-as-cn
      --description="{{ item['description'] | default('Service Account') }}"
      {% if item['account_disabled'] | default(false) %}--disabled{% endif %}
  register: service_accounts_create
  changed_when: '"User .* added successfully" in service_accounts_create.stdout'
  failed_when:
    - service_accounts_create.rc != 0
    - '"already exists" not in service_accounts_create.stderr'
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['name'] not in existing_domain_users['stdout']
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Check password expiry status
  become: true
  ansible.builtin.command:
    cmd: samba-tool user show {{ item['name'] }} --attributes=accountExpires
  register: service_accounts_expiry_check
  changed_when: false
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['password_never_expires'] | default(true)
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Set password to never expire
  become: true
  ansible.builtin.command:
    cmd: >
      samba-tool user setexpiry {{ item.item['name'] }} --noexpiry
  register: service_accounts_expiry
  changed_when: '"Set expiry for user" in service_accounts_expiry.stdout'
  loop: '{{ service_accounts_expiry_check.results }}'
  when:
    - item.item['password_never_expires'] | default(true)
    - '"accountExpires: 0" not in item.stdout'
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Update password if requested
  become: true
  ansible.builtin.command:
    cmd: >
      samba-tool user setpassword {{ item['name'] }}
      --newpassword='{{ item['password'] }}'
  register: service_accounts_password_update
  changed_when: service_accounts_password_update.rc == 0
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['update_password'] | default(false)
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Add to service accounts group
  become: true
  ansible.builtin.command:
    cmd: samba-tool group addmembers "{{ item['group'] | default('Service Accounts') }}" {{ item['name'] }} --object-types=user
  register: service_accounts_group
  changed_when: '"Added members" in service_accounts_group.stdout'
  failed_when:
    - service_accounts_group.rc != 0
    - '"already exists for target" not in service_accounts_group.stderr'
    - '"is already a member of the group" not in service_accounts_group.stderr'
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['add_to_group'] | default(true)
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Set SPNs (Service Principal Names) if specified
  become: true
  ansible.builtin.command:
    cmd: samba-tool spn add {{ item['spn'] }} {{ item['name'] }}
  register: service_accounts_spn
  changed_when: '"Registered" in service_accounts_spn.stdout'
  failed_when:
    - service_accounts_spn.rc != 0
    - '"already registered" not in service_accounts_spn.stderr'
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['spn'] is defined
    - item['spn'] | length > 0
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Export keytab if requested
  become: true
  ansible.builtin.command:
    cmd: >
      samba-tool domain exportkeytab {{ item['keytab_path'] }}
      --principal={{ item['name'] }}@{{ samba_ad_info.kerberos_realm | upper }}
  register: service_accounts_keytab
  changed_when: service_accounts_keytab.rc == 0
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['export_keytab'] | default(false)
    - item['keytab_path'] is defined
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Set keytab file permissions
  become: true
  ansible.builtin.file:
    path: "{{ item['keytab_path'] }}"
    owner: "{{ item['keytab_owner'] | default('root') }}"
    group: "{{ item['keytab_group'] | default('root') }}"
    mode: "{{ item['keytab_mode'] | default('0600') }}"
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - item['export_keytab'] | default(false)
    - item['keytab_path'] is defined
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Set facts for RFC2307 integration
  ansible.builtin.set_fact:
    _samba_ldap_suffix: ",DC={{ samba_ad_info.ad_dns_domain_name | regex_replace('\\.', ',DC=') }}"
    _samba_service_account_uid_start: "{{ samba_rfc2307_service_account_uid_start | default(samba_rfc2307_id_start | int + 1000) }}"
  when:
    - samba_enable_rfc2307 | default(false) | bool
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Check if service accounts have Unix attributes
  become: true
  ansible.builtin.command:
    cmd: >
      ldbsearch -H /var/lib/samba/private/sam.ldb
      "(&(objectClass=user)(cn={{ item['name'] }}))"
      uidNumber gidNumber
  register: _samba_service_account_unix_attrs
  changed_when: false
  loop: '{{ samba_domain_service_accounts }}'
  when:
    - samba_enable_rfc2307 | default(false) | bool
    - samba_domain_service_accounts | length > 0
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  tags:
    - samba_service_accounts
    - samba_domain_account_management

- name: Service accounts | Add Unix attributes (RFC2307) to service accounts
  become: true
  ansible.builtin.shell:
    cmd: >
      ldbmodify -H /var/lib/samba/private/sam.ldb
      -U Administrator%{{ samba_ad_info.adminpass }}
    stdin: |
      dn: CN={{ item.item['name'] }},CN=Users{{ _samba_ldap_suffix }}
      changetype: modify
      add: uidNumber
      uidNumber: {{ item.item['uid'] | default(_samba_service_account_uid_start | int + index) }}
      -
      add: gidNumber
      gidNumber: {{ item.item['gid'] | default(samba_rfc2307_id_start | int) }}
      -
      add: unixHomeDirectory
      unixHomeDirectory: /home/{{ item.item['name'] }}
      -
      add: loginShell
      loginShell: /bin/false
      -
      add: msSFU30NisDomain
      msSFU30NisDomain: {{ samba_ad_info.netbios_domain_name | lower }}
      -
      add: msSFU30Name
      msSFU30Name: {{ item.item['name'] }}
  no_log: '{{ samba_domain_service_accounts_no_log | bool }}'
  register: _samba_service_account_rfc2307
  changed_when: _samba_service_account_rfc2307.rc == 0
  failed_when:
    - _samba_service_account_rfc2307.rc != 0
    - '"Attribute or value exists" not in _samba_service_account_rfc2307.stderr'
  loop: "{{ _samba_service_account_unix_attrs.results | default([]) }}"
  loop_control:
    index_var: index
  when:
    - samba_enable_rfc2307 | default(false) | bool
    - _samba_service_account_unix_attrs is defined
    - item.stdout is defined
    - '"uidNumber:" not in item.stdout'
  tags:
    - samba_service_accounts
    - samba_domain_account_management
