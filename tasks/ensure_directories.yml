---
- name: Ensure Samba directories | Create base directories
  become: true
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - { path: '{{ samba_datadir }}', owner: 'root', group: 'root', mode: '0755' }
    - { path: '{{ samba_logdir }}', owner: 'root', group: 'adm', mode: '0750' }
    - { path: '{{ samba_statedir }}', owner: 'root', group: 'root', mode: '0755' }
  tags:
    - samba
    - samba-directories

- name: Ensure Samba directories | Create private directory
  become: true
  ansible.builtin.file:
    path: '{{ samba_datadir }}/private'
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - samba
    - samba-directories

- name: Ensure Samba directories | Create additional required directories
  become: true
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - '{{ samba_datadir }}/private/smbd.tmp'
  when: samba_server_role == "active directory domain controller"
  tags:
    - samba
    - samba-directories

- name: Ensure Samba directories | Create cores directory for debugging
  become: true
  ansible.builtin.file:
    path: '{{ samba_logdir }}/cores'
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - samba
    - samba-directories
